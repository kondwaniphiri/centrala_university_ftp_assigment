<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FTP Web Client</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">FTP Web Client</a>
    </div>
  </nav>

  <div class="container my-4">
    <div id="activity-bar" class="alert alert-info py-2 px-3 d-none small mb-3" role="alert" style="display:none;">
      <span id="activity-message">Idle</span><span id="activity-dots"></span>
    </div>
    <div class="card mb-3">
      <div class="card-body">
        <form id="connect-form" class="row g-2 align-items-center">
          <div class="col-md-3">
            <input class="form-control" id="host" placeholder="Host e.g. 127.0.0.1" value="127.0.0.1">
          </div>
          <div class="col-md-2">
            <input class="form-control" id="port" placeholder="Port" value="2121" type="number">
          </div>
          <div class="col-md-2">
            <input class="form-control" id="user" placeholder="User" value="user">
          </div>
          <div class="col-md-2">
            <input class="form-control" id="password" placeholder="Password" value="pass" type="password">
          </div>
          <div class="col-md-3 text-end">
            <button class="btn btn-primary" type="submit">Connect</button>
            <button class="btn btn-outline-secondary" type="button" id="disconnect-btn" disabled>Disconnect</button>
          </div>
        </form>
        <div id="status" class="mt-2 small text-muted">Not connected</div>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-lg-8">
        <div class="card mb-3">
          <div class="card-header d-flex justify-content-between align-items-center">
            <span>CSV Files</span>
            <div>
              <button class="btn btn-sm btn-outline-secondary" id="refresh-btn" disabled>Refresh</button>
            </div>
          </div>
          <div class="card-body">
            <div class="input-group mb-3">
              <span class="input-group-text">PWD</span>
              <input class="form-control" id="pwd" readonly>
            </div>
            <table class="table table-sm table-striped" id="files-table">
              <thead>
                <tr>
                  <th style="width:35px;"><input type="checkbox" id="master-page-check" title="Select page"></th>
                  <th>Name</th>
                  <th>Pattern</th>
                  <th>Downloaded</th>
                </tr>
              </thead>
              <tbody id="files-tbody"></tbody>
            </table>
            <div class="d-flex justify-content-between align-items-center small" id="pagination-bar">
              <div>
                <button class="btn btn-sm btn-outline-secondary" id="prev-page" disabled>&lt;</button>
                <span id="page-info" class="mx-2">Page 1/1</span>
                <button class="btn btn-sm btn-outline-secondary" id="next-page" disabled>&gt;</button>
              </div>
              <div class="text-muted" id="total-info"></div>
            </div>
            <div class="mt-2 small">New files not yet downloaded: <span id="new-files" class="fw-bold">(n/a)</span></div>
          </div>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="card">
          <div class="card-header">Bulk Download Actions</div>
          <div class="card-body action-panel-scroll">
            <p class="small text-muted mb-2">Select CSV files in the table then use the buttons below.</p>
            <div class="d-grid gap-2">
              <button class="btn btn-primary" id="bulk-download-btn" disabled>Download</button>
              <button class="btn btn-outline-info" id="check-new-btn" disabled>Check New Files</button>
              <button class="btn btn-outline-primary" id="select-all-files-btn" disabled>Select All Files</button>
              <button class="btn btn-outline-warning" id="clear-selection-btn" disabled>Clear Selection</button>
            </div>
            <hr>
            <label class="form-label">Bulk Download Results</label>
            <textarea id="bulk-output" class="form-control results-small" rows="10" readonly placeholder="Results will appear here as sentences."></textarea>
            <div id="results-summary" class="mt-2 small text-muted"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
