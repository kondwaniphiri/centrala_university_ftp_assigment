name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r interface/ftp_client_backend/requirements.txt
          pip install pytest
      - name: Run_tests
        run: pytest -q --maxfail=1 --disable-warnings

  node-check:
    name: Node Install & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install deps
        working-directory: FTP_server
        run: npm ci --no-audit --no-fund
      - name: Frontend regression tests
        run: node --test tests/test_web_client.cjs
      - name: Basic audit (non-blocking)
        working-directory: FTP_server
        run: |
          npm audit --production || echo "Audit issues (informational)"
      - name: Smoke start server (5s)
        run: |
          node FTP_server/server.js &
          SERVER_PID=$!
          sleep 5
          kill $SERVER_PID || true

  package-artifact:
    name: Package Artifact
    runs-on: ubuntu-latest
    needs: [python-tests, node-check]
    steps:
      - uses: actions/checkout@v4
      - name: Create artifact bundle
        run: |
          mkdir dist
          cp -r FTP_server interface tests output reset_state.py README.md Report.docx .gitignore dist/
          tar -czf project_bundle.tgz dist
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: project_bundle
          path: project_bundle.tgz
